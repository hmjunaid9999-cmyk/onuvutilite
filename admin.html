<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onuvuti Lite Admin</title>
<style>:root{--bg:#0b0b0c;--fg:#eee;--card:#1b1b1e;--line:#333;--g:#22c55e;--r:#e5484d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}h1{font-size:18px;margin:0;flex:1;color:var(--g)}
button,input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}button{cursor:pointer}button.p{background:var(--g);color:#000;border-color:var(--g)}button.d{border-color:var(--r);color:var(--r)}
nav{display:flex;gap:6px;padding:10px;overflow-x:auto}nav button.on{background:var(--fg);color:var(--bg)}main{padding:10px;max-width:900px;margin:auto}.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;word-break:break-word}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}textarea{width:100%;min-height:200px;font-family:monospace;font-size:13px}small{opacity:.65}#msg{padding:8px 12px;color:var(--g)}</style></head><body>
<header><button id="back" onclick="history.back()">‹ Back</button><h1>Onuvuti Lite Admin</h1><span id="who"></span><button id="in" class="p">Sign in with Google</button><button id="out" style="display:none">Sign out</button></header>
<nav id="tabs"><button data-t="reports" class="on">Reports</button><button data-t="posts">Posts</button><button data-t="users">Users</button><button data-t="settings">Settings</button></nav><div id="msg"></div><main id="m"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";
import{getFirestore,collection,getDocs,getDoc,setDoc,deleteDoc,doc,query,orderBy,limit,Timestamp}from"https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";
const app=initializeApp({
    apiKey: "AIzaSyBi5nb_B_ymD5dR-jGh_RMYMWLrtnHTOCA",
    authDomain: "onuvuti-5c9e3.firebaseapp.com",
    projectId: "onuvuti-5c9e3",
    storageBucket: "onuvuti-5c9e3.firebasestorage.app",
    messagingSenderId: "846713879232",
    appId: "1:846713879232:web:538c47101eade3e2df8b25",
    measurementId: "G-2K2L45CMWR"
  }),auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i),M=$("m");let U=null,tab="reports",stack=[];
const esc=s=>String(s??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])),say=t=>{$("msg").textContent=t;setTimeout(()=>$("msg").textContent="",4000)},err=e=>{$("msg").style.color="#e5484d";say(e.code||e.message);setTimeout(()=>$("msg").style.color="",4100)};
const plain=o=>JSON.stringify(o,(k,v)=>v&&v.toDate?v.toDate().toISOString():v,2);
$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(err);$("out").onclick=()=>signOut(auth);
const ADMIN="hmjunaid9999@gmail.com";onAuthStateChanged(auth,u=>{if(u&&(u.email||"").toLowerCase()!==ADMIN){signOut(auth);err({message:"This account is not allowed. Sign in with the admin Gmail."});u=null}U=u;$("who").textContent=u?u.email:"";$("in").style.display=u?"none":"";$("out").style.display=u?"":"none";go(tab)});
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)go(b.dataset.t,true)};
history.replaceState({t:"reports"},"");addEventListener("popstate",e=>{if(e.state&&e.state.t)go(e.state.t,false);else history.pushState({t:tab},"")});
function go(t,push){tab=t;if(push)history.pushState({t},"");document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(!U){M.innerHTML='<div class="c">Please sign in with an admin account.</div>';return}({reports,posts,users,settings})[t]().catch(err)}
async function reports(){const s=await getDocs(query(collection(db,"reports"),limit(50)));M.innerHTML=s.empty?'<div class="c">No reports.</div>':"";s.forEach(d=>{const x=d.data(),c=document.createElement("div");c.className="c";c.innerHTML="<pre style='white-space:pre-wrap;margin:0'>"+esc(plain(x))+"</pre><div class='row'>"+(x.postId?"<button class='d' data-p='"+esc(x.postId)+"'>Delete post</button>":"")+"<button data-r='"+d.id+"'>Dismiss report</button></div>";M.append(c)});}
async function posts(){const s=await getDocs(query(collection(db,"posts"),orderBy("createdAt","desc"),limit(30)));M.innerHTML="";s.forEach(d=>{const x=d.data(),c=document.createElement("div");c.className="c";c.innerHTML="<b>"+esc(x.authorName)+"</b> <small>"+esc(x.authorUid)+"</small><div>"+esc((x.text||x.type||"").toString().slice(0,200))+"</div><div class='row'><button class='d' data-p='"+d.id+"'>Delete post</button></div>";M.append(c)})}
async function users(){M.innerHTML="<div class='c'><input id='uid' placeholder='User UID' style='width:100%'><div class='row'><button id='ld' class='p'>Load</button></div></div><div id='ub'></div>";$("ld").onclick=async()=>{const id=$("uid").value.trim(),s=await getDoc(doc(db,"users",id));$("ub").innerHTML=s.exists()?"<div class='c'><pre style='white-space:pre-wrap;margin:0'>"+esc(plain(s.data()))+"</pre><div class='row'><select id='days'><option>1</option><option>3</option><option>7</option><option>30</option><option>365</option></select><button class='d' id='sus'>Suspend (days)</button><button id='uns'>Unsuspend</button></div></div>":"<div class='c'>User not found.</div>";if(s.exists()){$("sus").onclick=()=>setDoc(doc(db,"users",id),{suspendedUntil:Timestamp.fromMillis(Date.now()+86400000*+$("days").value)},{merge:true}).then(()=>say("Suspended")).catch(err);$("uns").onclick=()=>setDoc(doc(db,"users",id),{suspendedUntil:null},{merge:true}).then(()=>say("Unsuspended")).catch(err)}}}
async function settings(){M.innerHTML="";for(const n of["site","messages"]){const s=await getDoc(doc(db,"settings",n)),c=document.createElement("div");c.className="c";c.innerHTML="<b>settings/"+n+"</b><textarea data-s='"+n+"'>"+esc(plain(s.exists()?s.data():{}))+"</textarea><div class='row'><button class='p' data-save='"+n+"'>Save</button></div>";M.append(c)}}
M.onclick=async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.p&&confirm("Delete this post?")){await deleteDoc(doc(db,"posts",b.dataset.p));say("Deleted");go(tab)}if(b.dataset.r){await deleteDoc(doc(db,"reports",b.dataset.r));go(tab)}if(b.dataset.save){const t=M.querySelector("[data-s='"+b.dataset.save+"']");await setDoc(doc(db,"settings",b.dataset.save),JSON.parse(t.value),{merge:true});say("Saved")}}catch(x){err(x)}};
</script></body></html>
